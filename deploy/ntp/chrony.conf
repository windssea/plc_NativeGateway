# Isolated lab: serve the Docker host clock, which is also the Hub host clock.
# This is a shared LAN reference, not an independently traceable UTC source.
# In production replace this local reference with the site's disciplined source.
local stratum 10
allow 192.168.0.0/24
# Docker Desktop may SNAT forwarded LAN packets to its private bridge gateway.
allow 192.168.65.0/24
allow 172.16.0.0/12
cmdport 0
driftfile /var/lib/chrony/drift
logdir /var/log/chrony
log measurements statistics tracking
